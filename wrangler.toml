# MAXWEB — Cloudflare Workers / Pages (OpenNext)
# Docs: https://opennext.js.org/cloudflare

name = "maxweb"
main = ".open-next/worker.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Static assets produced by OpenNext
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# Optional: enable Workers Logs in the dashboard
# [observability]
# enabled = true

# ── Secrets (set with: wrangler secret put NAME) ─────────────────────────────
# Do NOT put real secrets in this file.
#
# Required secrets / vars (same names as Vercel):
#   AUTHGEAR_CLIENT_ID
#   AUTHGEAR_SESSION_SECRET
#   AUTHGEAR_ADMIN_EMAILS
#   AUTHGEAR_REDIRECT_URI
#   AUTHGEAR_POST_LOGOUT_REDIRECT_URI
#   AUTHGEAR_ISSUER                    (optional)
#   SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_URL           (optional alias)
#   SUPABASE_ANON_KEY
#   NEXT_PUBLIC_SUPABASE_ANON_KEY      (optional alias)
#   SUPABASE_SERVICE_ROLE_KEY
#   MAXWEB_AI_API_KEY2
#   MAXWEB_GEMINI_MODEL                (optional)
#   CRON_SECRET                        (optional, if using scheduled summaries)

# Plain (non-secret) vars can go under [vars] after you know the public hostname:
# [vars]
# AUTHGEAR_ISSUER = "https://lyrics-6xahba.authgear.cloud"
