name: MAXWEB CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/maxweb-authgear-auth]

permissions:
  contents: read

concurrency:
  group: maxweb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete test suite
        run: npm test
      - name: Run production build
        run: npm run build
