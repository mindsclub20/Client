name: MAXWEB CI

on:
  push:
    branches:
      - feature/ai-admin-client-dashboards
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
      - name: Inspect embedded website archive
        run: unzip -l MAXWEB.zip
      - name: Build Next.js application
        run: npm run build
