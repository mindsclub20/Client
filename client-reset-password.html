<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset MAXWEB client password</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="invite-page">
  <main class="invite-card">
    <a class="brand" href="/">MAXWEB <small>CLIENT ACCOUNT SECURITY</small></a>
    <p class="eyebrow">PASSWORD RESET</p>
    <h1>Set a new password</h1>
    <form id="resetForm" class="form">
      <div class="field full"><label for="password">New password</label><input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <div class="field full"><label for="confirmation">Confirm new password</label><input id="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></div>
      <div class="field full"><button id="submit" class="button" type="submit">Update password</button></div>
    </form>
    <p id="message" class="muted" role="status"></p>
    <a href="/#login">Return to login</a>
  </main>
  <script type="module" src="/js/client-reset-password.js"></script>
</body>
</html>
