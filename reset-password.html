<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Reset your MAXWEB password</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body class="invite-page">
  <main class="invite-card">
    <a class="brand" href="/">MAXWEB <small>ACCOUNT SECURITY</small></a>
    <p class="eyebrow">PASSWORD RESET</p>
    <h1>Set a new password</h1>
    <p>Choose a new password for your MAXWEB account. This link can only be used once.</p>
    <form id="resetForm" class="form">
      <div class="field full">
        <label for="password">New password</label>
        <input id="password" name="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      </div>
      <div class="field full">
        <label for="confirmation">Confirm new password</label>
        <input id="confirmation" name="confirmation" type="password" minlength="8" maxlength="128" autocomplete="new-password" required>
      </div>
      <div class="field full">
        <button id="submit" class="button" type="submit">Set new password</button>
      </div>
    </form>
    <p id="message" class="muted" aria-live="polite"></p>
    <a href="/#login">Return to login</a>
  </main>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
